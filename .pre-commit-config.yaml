# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    # -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-symlinks
    -   id: debug-statements
    -   id: destroyed-symlinks

-   repo: https://github.com/astral-sh/uv-pre-commit
    # Use the latest uv version or a specific tag
    rev: 0.12.13
    hooks:
      - id: uv-lock

-   repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.7
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]
        language: system
      # Run the formatter.
      - id: ruff-format
        language: system

-   repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.3.0  # Replace with the latest release tag
    hooks:
      - id: pyrefly-check
        language: system

-   repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

-   repo: local
    hooks:
      - id: zensical-build
        name: Validate Zensical Build
        entry: zensical build --clean
        language: system
        pass_filenames: false
        always_run: true
